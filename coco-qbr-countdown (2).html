<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road to QBR</title>
<style>
:root{
  --navy:#193157; --green:#5DA836; --amber:#F2A900; --red:#CA1C2C;
  --bg:#0E1A2E; --surface:#16294A; --surface-2:#1D3359; --line:rgba(255,255,255,.09);
  --text:#F2F5FA; --muted:#A3B0C6; --green-ink:#86D15C; --amber-ink:#FFC233; --red-ink:#FF6B76;
  --asphalt:#26303D; --asphalt-edge:#3A4656; --tile-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 6px 18px rgba(0,0,0,.28);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#F4F6F9; --line:rgba(19,34,61,.1);
    --text:#13223D; --muted:#596780; --green-ink:#3E7F1F; --amber-ink:#8F6400; --red-ink:#B0101F;
    --asphalt:#2F3A49; --asphalt-edge:#5A6677; --tile-shadow:0 1px 2px rgba(19,34,61,.08), 0 6px 16px rgba(19,34,61,.08);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}

.frame{position:relative;width:100%;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
  overflow:hidden;container-type:size;container-name:frame;
  background:radial-gradient(120% 60% at 100% 0%,rgba(93,168,54,.13),transparent 60%),radial-gradient(90% 55% at 0% 100%,rgba(102,69,147,.16),transparent 60%),var(--bg)}
.frame.fixed{height:auto;width:min(100vw, calc(100vh * var(--ar)));width:min(100vw, calc(100dvh * var(--ar)));
  max-height:100vh;max-height:100dvh;top:50%;transform:translateY(-50%)}

/* Brand band */
.brand{flex:none;display:flex;align-items:center;gap:12px;background:var(--navy);
  padding:clamp(6px,1.6cqmin,16px) clamp(12px,3cqw,32px);position:relative}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;z-index:1;
  background:linear-gradient(90deg,#5DA836 0 20%,#F2A900 20% 40%,#E8336D 40% 60%,#664593 60% 80%,#2F80ED 80%)}
.brand img{display:block;height:clamp(22px,8cqmin,72px);width:auto;max-width:52%;object-fit:contain}
.brand .titles{margin-left:auto;text-align:right;min-width:0}
.brand h1{margin:0;font-size:clamp(14px,4.4cqmin,38px);font-weight:800;letter-spacing:-.015em;color:#fff;white-space:nowrap}
.brand .when{display:block;font-size:clamp(11px,2.6cqmin,20px);font-weight:600;color:#8ED163;margin-top:1px;white-space:nowrap}

/* Main stage */
.stage{flex:1 1 auto;min-height:0;width:100%;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;
  justify-content:space-evenly;gap:clamp(6px,2cqh,28px);padding:clamp(8px,2.4cqh,28px) clamp(12px,3cqw,32px)}

.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:clamp(11px,2.6cqmin,20px);font-weight:700;border-radius:999px;
  padding:.35em .85em;white-space:nowrap;background:rgba(93,168,54,.16);color:var(--green-ink)}
.pill .dot{width:.55em;height:.55em;border-radius:50%;background:currentColor;animation:status 2s ease-in-out infinite}
.pill.amber{background:rgba(242,169,0,.17);color:var(--amber-ink)}
.pill.red{background:rgba(202,28,44,.16);color:var(--red-ink)}
.pill.red .dot{animation:pulse 1.5s ease-in-out infinite}
.pill.done{background:var(--surface-2);color:var(--muted)}
.pill.done .dot{animation:none}
.cheer{font-size:clamp(13px,3.4cqmin,30px);font-weight:700;letter-spacing:-.01em;margin:0}

/* Hero card */
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:clamp(8px,2cqh,22px);
  border-radius:clamp(14px,2.6cqmin,26px);padding:clamp(10px,2.2cqh,26px) clamp(10px,2.4cqw,28px);color:#fff;
  background:linear-gradient(125deg,#193157 0%,#24356F 45%,#664593 100%);box-shadow:0 10px 26px rgba(25,49,87,.32)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;
  background:radial-gradient(circle at 8% 18%,#F2A900 0 3px,transparent 4px),radial-gradient(circle at 92% 14%,#E8336D 0 3px,transparent 4px),
  radial-gradient(circle at 84% 86%,#9FD97E 0 2.5px,transparent 3.5px),radial-gradient(circle at 18% 88%,#3FA9F5 0 2.5px,transparent 3.5px),
  radial-gradient(circle at 50% 6%,#fff 0 2px,transparent 3px),radial-gradient(circle at 66% 92%,#FFE07A 0 2px,transparent 3px)}
.hero > *{position:relative}
.hero .cheer{color:#fff}
.hero .pill{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.22)}
.hero .pill .dot{background:#86D15C}
.hero .pill.amber .dot{background:#FFC233}
.hero .pill.red{background:rgba(232,51,109,.35)}
.hero .pill.red .dot{background:#fff}
.hero .pill.done .dot{background:#C7CFDA}

/* Countdown tiles */
.clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.8cqw,22px)}
.unit{--g1:#FFD24D;--g2:#F2A900;--ink:#193157;background:linear-gradient(160deg,var(--g1),var(--g2));color:var(--ink);
  border:1px solid rgba(255,255,255,.28);border-radius:clamp(10px,2.2cqmin,22px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(0,0,0,.25);
  text-align:center;padding:clamp(6px,1.8cqh,22px) 4px clamp(5px,1.4cqh,18px);position:relative;overflow:hidden;perspective:400px}
.unit::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.12)}
.unit::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none}
.unit.hours{--g1:#5BC0FF;--g2:#2F6FED;--ink:#fff}
.unit.mins{--g1:#FF7AA8;--g2:#E8336D;--ink:#fff}
.unit.secs{--g1:#C4A4FF;--g2:#7A4FD1;--ink:#fff}
.num{display:block;font-size:clamp(14px,min(12cqw,16cqh),180px);font-weight:800;line-height:1;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;transform-origin:50% 55%}
.num.flip{animation:flip .42s cubic-bezier(.3,.7,.3,1)}
.lbl{display:block;font-size:clamp(10px,2.4cqmin,20px);font-weight:800;opacity:.85;margin-top:.35em;text-transform:uppercase;letter-spacing:.06em}
.num.three{font-size:clamp(12px,min(9cqw,13cqh),150px)}
.arrived{display:none;text-align:center;font-size:clamp(28px,min(10cqw,15cqh),120px);font-weight:800;letter-spacing:-.03em;
  line-height:1.05;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.arrived small{display:block;font-size:.32em;font-weight:600;color:rgba(255,255,255,.82);letter-spacing:0;margin-top:.4em}
.stage.is-live .clock,.stage.is-after .clock{display:none}
.stage.is-live .arrived,.stage.is-after .arrived{display:block}

/* Road */
.road-wrap{position:relative;border-radius:clamp(14px,2.6cqmin,26px);overflow:hidden;padding:clamp(14px,5cqh,56px) 0 clamp(8px,1.6cqh,18px);
  background:linear-gradient(#8FD0FF 0%,#DDF2FF 52%,#6DBB45 52%,#4E9A2C 100%);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.road-wrap .sun{position:absolute;top:clamp(6px,1.6cqh,16px);right:12%;width:clamp(14px,4cqh,42px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#FFE07A 0 55%,rgba(255,224,122,0) 70%);box-shadow:0 0 0 6px rgba(255,224,122,.25)}
.road-wrap .cloud{position:absolute;top:clamp(6px,1.8cqh,18px);width:clamp(28px,8cqh,90px);height:clamp(9px,2.4cqh,26px);border-radius:999px;background:#fff;opacity:.9;
  animation:drift 40s linear infinite}
.road-wrap .cloud::before{content:"";position:absolute;left:22%;bottom:30%;width:45%;height:130%;border-radius:50%;background:#fff}
.road-wrap .cloud.c2{top:clamp(10px,3cqh,30px);left:58%;transform:scale(.7);animation-duration:55s;animation-delay:-20s}
@keyframes drift{from{left:-15%}to{left:110%}}
@media (prefers-color-scheme: dark){
  .road-wrap{background:linear-gradient(#1C3769 0%,#3A5FA0 52%,#3F7F2A 52%,#2F6A22 100%)}
  .road-wrap .cloud{opacity:.35}
}
.road{position:relative;height:clamp(30px,10cqh,110px);background:linear-gradient(#3A4555,#262F3C);
  border-top:4px solid #F2F5FA;border-bottom:4px solid #F2F5FA;overflow:hidden;
  box-shadow:0 -3px 0 #4E9A2C,0 3px 0 #4E9A2C}
.road .dash{position:absolute;top:50%;left:100%;width:16%;height:clamp(3px,.9cqh,8px);margin-top:calc(clamp(3px,.9cqh,8px) / -2);
  border-radius:4px;background:rgba(255,255,255,.75);animation:dash 2.4s linear infinite}
.road .dash:nth-child(2){animation-delay:-.8s}
.road .dash:nth-child(3){animation-delay:-1.6s}
.road .trail{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(242,169,0,0),rgba(242,169,0,.28));
  width:var(--p,0%)}
.flag{position:absolute;right:clamp(6px,1.4cqw,14px);top:50%;height:72%;aspect-ratio:3/4;transform:translateY(-50%)}
.car{position:absolute;bottom:14%;height:62%;aspect-ratio:2/1;left:calc(var(--p,0%) * .86);z-index:2;
  transition:left 1.2s cubic-bezier(.3,.7,.3,1)}
.car svg{display:block;width:100%;height:100%;animation:bob .9s ease-in-out infinite}
.car .puff{position:absolute;left:-14%;bottom:18%;width:16%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.45);
  opacity:0;animation:puff 5.5s linear infinite}
.car .puff:nth-child(2){animation-delay:-1.83s}
.car .puff:nth-child(3){animation-delay:-3.66s}
.ends{display:flex;justify-content:space-between;font-size:clamp(10px,2.2cqmin,18px);margin:.55em clamp(8px,1.6cqw,16px) 0;font-weight:800}
.ends span,.ends b{border-radius:999px;padding:.2em .7em;background:rgba(255,255,255,.88);color:#193157}
.ends b{background:linear-gradient(90deg,#FFD24D,#F2A900);color:#193157}

/* Footer meta */
.meta{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6cqw,18px);font-size:clamp(11px,2.5cqmin,20px)}
.mchip{display:flex;align-items:center;gap:.7em;border-radius:clamp(12px,2.2cqmin,20px);padding:.7em .9em;min-width:0;
  background:var(--surface);border:1px solid var(--line)}
.mchip .ic{flex:none;width:2.2em;height:2.2em;border-radius:.7em;display:flex;align-items:center;justify-content:center;color:#fff}
.mchip .ic svg{width:60%;height:60%}
.mchip.date .ic{background:linear-gradient(150deg,#B596F0,#664593)}
.mchip.prog .ic{background:linear-gradient(150deg,#FFD24D,#F2A900);color:#193157}
.mchip .tx{min-width:0;flex:1}
.mchip .k{display:block;font-size:.82em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mchip .v{display:block;font-weight:800;line-height:1.25;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:block;height:.45em;margin-top:.35em;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#5DA836,#F2A900,#E8336D);transition:width 1.2s ease}

@keyframes dash{from{left:100%}to{left:-16%}}
@keyframes status{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes flip{0%{transform:rotateX(-80deg);opacity:.2}60%{transform:rotateX(10deg);opacity:1}100%{transform:rotateX(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}8%{opacity:.7}30%{opacity:0;transform:translate(-120%,-40%) scale(1.4)}100%{opacity:0}}

/* Confetti */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:0;animation:fall 2.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}

/* Shed blocks as height shrinks so nothing overflows */
@container frame (max-height: 360px){ .meta{display:none} }
@container frame (max-height: 280px){ .status{display:none} .ends{display:none} .road-wrap{padding-top:10px;padding-bottom:6px} .road-wrap .sun,.road-wrap .cloud{display:none} }
@container frame (max-height: 200px){ .road-wrap{display:none} }
@container frame (max-width: 400px){
  .brand .when{display:none}
  .meta{grid-template-columns:1fr}
}
@container frame (max-width: 400px) and (max-height: 520px){ .meta{display:none} }
@container frame (max-width: 200px){
  .stage{padding:6px} .hero{padding:8px 5px;border-radius:10px} .clock{gap:3px} .unit{border-radius:7px;padding:4px 1px}
  .num,.num.three{font-size:9cqw} .lbl{font-size:7px;letter-spacing:0}
}
@media (prefers-reduced-motion: reduce){
  .road .dash,.pill .dot,.car svg,.car .puff,.num.flip,.road-wrap .cloud{animation:none}
  .bar i{transition:none}
  .road .dash{display:none}
  .confetti{display:none}
}
</style>
</head>

<script>
/* ---- WorkJam variables (all read, even if unused) ---- */
const params = new URLSearchParams(window.location.search);
const DEFAULT_TARGET = '2027-01-20T09:00:00-05:00';
const DEFAULT_START = '2026-10-01T00:00:00-04:00';
const vars = {
  externalLocationId: params.get('externalLocationId') || null,
  externalLocationCode: params.get('externalLocationCode') || null,
  address: params.get('address') || null,
  city: params.get('city') || null,
  stateOrProvince: params.get('stateOrProvince') || null,
  country: params.get('country') || null,
  zipCode: params.get('zipCode') || null,
  externalRegionId: params.get('externalRegionId') || null,
  externalRegionCode: params.get('externalRegionCode') || null,
  employeeId: params.get('employeeId') || null,
  employeeCode: params.get('employeeCode') || null,
  username: params.get('username') || null,
  language: params.get('language') || 'en',
  aspectRatio: params.get('aspectRatio') || 'fill',
  // custom variables
  targetDate: params.get('targetDate') || DEFAULT_TARGET,   // ISO timestamp
  eventName: params.get('eventName') || 'QBR',              // string
  previewNow: params.get('previewNow') || null,             // ISO timestamp, QA only
};
const RATIOS = { standard: '4 / 3', square: '1 / 1', landscape: '16 / 9', portrait: '9 / 16' };
(function applySize() {
  const f = document.querySelector('.frame');
  const r = params.has('aspectRatio') ? RATIOS[vars.aspectRatio] : null;
  if (r) {
    const [w, h] = r.split('/').map(Number);
    f.classList.add('fixed'); f.style.setProperty('--ar', String(w / h)); f.style.aspectRatio = r;
  }
})();

/* ---- Timing ---- */
let TARGET = Date.parse(vars.targetDate);
if (isNaN(TARGET)) TARGET = Date.parse(DEFAULT_TARGET);
const usingDefault = TARGET === Date.parse(DEFAULT_TARGET);
const START = usingDefault ? Date.parse(DEFAULT_START) : TARGET - 90 * 864e5;   // custom target: one quarter of road
const EVENT = vars.eventName.slice(0, 24);

const loadedAt = Date.now();
const previewBase = vars.previewNow ? Date.parse(vars.previewNow) : NaN;
const now = () => isNaN(previewBase) ? Date.now() : previewBase + (Date.now() - loadedAt);  // elapsed seconds x 1

const TZ_ET = 'America/New_York', TZ_CT = 'America/Chicago';
const fmt = (opts, tz) => new Intl.DateTimeFormat('en-US', { timeZone: tz, ...opts });
const etDay = ms => { const p = new Intl.DateTimeFormat('en-CA', { timeZone: TZ_ET, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ms).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]) / 864e5; };
const etSecondsIntoDay = ms => { const p = fmt({ hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23' }, TZ_ET).formatToParts(ms); const g = t => +p.find(x => x.type === t).value; return g('hour') * 3600 + g('minute') * 60 + g('second'); };
const END_OF_DAY = TARGET + (86400 - etSecondsIntoDay(TARGET)) * 1000;   // midnight ET after the event starts
const TARGET_DAY = etDay(TARGET);

const timeET = fmt({ hour: 'numeric', minute: '2-digit' }, TZ_ET).format(TARGET);
const timeCT = fmt({ hour: 'numeric', minute: '2-digit' }, TZ_CT).format(TARGET);
const dateLong = fmt({ weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }, TZ_ET).format(TARGET);
const dateShort = fmt({ month: 'short', day: 'numeric', year: 'numeric' }, TZ_ET).format(TARGET);

const $ = id => document.getElementById(id);
$('title').textContent = 'Road to ' + EVENT;
document.title = 'Road to ' + EVENT;
$('clock').setAttribute('aria-label', 'Time until ' + EVENT);
$('whenShort').textContent = `${dateShort}, ${timeET} ET`;
$('whenLong').textContent = `${dateLong}, ${timeET} ET / ${timeCT} CT`;
$('startLbl').textContent = fmt({ month: 'short', day: 'numeric' }, TZ_ET).format(START);
$('finishLbl').textContent = EVENT + ' day';

/* ---- Render ---- */
const last = {};
function setNum(id, v) {
  if (last[id] === v) return;
  const el = $(id); el.textContent = v; last[id] = v;
  el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
}
const pad = n => String(n).padStart(2, '0');
let lastPhase = null, lastMark = null;

function tick() {
  const t = now();
  const left = TARGET - t;
  const phase = left > 0 ? 'count' : (t < END_OF_DAY ? 'live' : 'after');
  const stage = $('stage');
  stage.classList.toggle('is-live', phase === 'live');
  stage.classList.toggle('is-after', phase === 'after');

  const progress = Math.min(1, Math.max(0, (t - START) / (TARGET - START)));
  const pctTxt = Math.floor(progress * 100) + '%';
  $('pct').textContent = phase === 'count' ? pctTxt : '100%';
  $('bar').style.width = phase === 'count' ? (progress * 100).toFixed(2) + '%' : '100%';
  $('road').style.setProperty('--p', (phase === 'count' ? progress * 100 : 100) + '%');

  const daysOut = TARGET_DAY - etDay(t);   // calendar days in ET
  const pill = $('pill');
  let pillCls = '', pillTxt, cheer;

  if (phase === 'count') {
    const sec = Math.floor(left / 1000);
    const dd = Math.floor(sec / 86400);
    $('d').classList.toggle('three', dd > 99);
    setNum('d', String(dd));
    setNum('h', pad(Math.floor(sec % 86400 / 3600)));
    setNum('m', pad(Math.floor(sec % 3600 / 60)));
    setNum('s', pad(sec % 60));
    const daysLeft = left / 864e5;
    if (daysLeft < 1) { pillCls = 'red'; pillTxt = 'Almost there!'; }
    else if (daysLeft <= 14) { pillCls = 'amber'; pillTxt = 'Final stretch'; }
    else { pillTxt = 'On the road'; }

    if (daysOut === 0) cheer = 'Today’s the day!';
    else if (daysOut === 1) cheer = 'Tomorrow’s the day!';
    else if (daysOut <= 7) cheer = 'One week out. Let’s go!';
    else if (daysOut <= 14) cheer = 'Two weeks out. Keep it rolling!';
    else if (daysOut <= 30) cheer = 'Under a month to go!';
    else if (progress >= 0.5) cheer = 'Halfway there!';
    else cheer = '';
    $('clock').setAttribute('aria-label', `${Math.floor(sec / 86400)} days, ${Math.floor(sec % 86400 / 3600)} hours until ${EVENT}`);
  } else if (phase === 'live') {
    pillTxt = 'We made it'; cheer = 'See you there, team!';
    $('arrived').innerHTML = `It’s ${esc(EVENT)} day!<small>${esc(timeET)} ET / ${esc(timeCT)} CT</small>`;
  } else {
    pillCls = 'done'; pillTxt = 'Complete'; cheer = 'Thanks for a great ' + EVENT + '.';
    $('arrived').innerHTML = `That’s a wrap. Thanks, team!<small>${esc(EVENT)} was ${esc(dateShort)}</small>`;
  }
  pill.className = 'pill' + (pillCls ? ' ' + pillCls : '');
  if ($('pillTxt').textContent !== pillTxt) $('pillTxt').textContent = pillTxt;
  if ($('cheer').textContent !== cheer) $('cheer').textContent = cheer;

  // Confetti: 30-day, 7-day and 1-day marks, and event day; once per visit per mark
  const mark = phase === 'live' ? 'live' : (phase === 'count' && [30, 7, 1].includes(daysOut) ? 'd' + daysOut : null);
  if (mark && mark !== lastMark) confetti();
  lastMark = mark; lastPhase = phase;
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['#5DA836', '#664593', '#F2A900', '#CA1C2C', '#FFFFFF', '#3FA9F5'];
  const h = $('frame').clientHeight;
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('i');
    s.style.left = (4 + (i * 37) % 92) + '%';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--dx', ((i * 53) % 120 - 60) + 'px');
    s.style.setProperty('--dy', Math.round(h * (0.55 + ((i * 29) % 40) / 100)) + 'px');
    s.style.setProperty('--r', ((i * 97) % 720 - 360) + 'deg');
    s.style.animationDelay = ((i * 7) % 12) * 0.05 + 's';
    box.appendChild(s);
  }
  $('frame').appendChild(box);
  setTimeout(() => box.remove(), 3600);
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
